name: Deploy

# Builds the image and points deploy/ at it. Argo CD does the actual deploy
# when it sees the commit - nothing here talks to the cluster.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v1.<commits on main>: only goes up, and a rebuild of a commit keeps its tag.
      - name: Version
        run: echo "TAG=v1.$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/benmcd23/chatbot:${{ env.TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pushed with GITHUB_TOKEN, which doesn't trigger workflows, so this can't loop.
      - name: Point deploy/ at the new image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s/^\(\s*newTag:\).*/\1 $TAG/" deploy/kustomization.yaml
          git commit -am "Deploy $TAG [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
