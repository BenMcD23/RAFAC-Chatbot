name: Test

# Runs on PRs and before every deploy (deploy.yml calls it). The models are faked
# in conftest.py, so this needs CPU torch but never downloads a model.

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check --isolated --line-length 120 --select E,F,W,I .
      - run: pytest -q
