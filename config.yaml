# Glob patterns matched against the filename (case-insensitive). Matching files are not indexed.
# "form" must be a word of its own: separated on both sides, so "Information..." and
# "Uniform Guide" aren't caught (a bare "*form[ _.-]*" matched "uniform ").
exclude_patterns:
  - "form[ _.-]*"
  - "forms[ _.-]*"
  - "*[ _.-]form[ _.-]*"
  - "*[ _.-]forms[ _.-]*"
